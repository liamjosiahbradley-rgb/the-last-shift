name: Build THE LAST SHIFT for ArkOS (ARM hard-float)
on:
  workflow_dispatch:

jobs:
  build-armhf:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build in Ubuntu 20.04 environment for older ArkOS compatibility
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:20.04 bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              dpkg --add-architecture armhf
              apt-get update
              apt-get install -y --no-install-recommends \
                gcc-arm-linux-gnueabihf \
                libc6-dev-armhf-cross \
                libsdl2-dev:armhf \
                make \
                ca-certificates
              arm-linux-gnueabihf-gcc -O2 -Wall \
                -I/usr/include/SDL2 \
                src/main.c -o lastshift \
                -L/usr/lib/arm-linux-gnueabihf \
                -lSDL2 -lm
              file lastshift
              readelf -h lastshift | grep -E "Class:|Machine:"
              mkdir -p build-output
              cp lastshift build-output/
              cp ports/lastshift.sh build-output/
            '

      - name: Upload ARM build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lastshift-arkos-armhf-test-build
          path: build-output/*
